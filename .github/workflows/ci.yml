name: CI NovaTech
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tests unitaires
        working-directory: application
        run: python -m unittest discover -s tests -v
      - name: Notification ChatOps (Discord)
        if: failure()
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## CI NovaTech en échec"
            echo "- Branche : ${BRANCH}"
            echo "- Commit : ${COMMIT_SHA}"
            echo "- Run : ${RUN_URL}"
            echo "- Action attendue : l'auteur du commit corrige ou annule le changement"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            PAYLOAD=$(jq -n \
              --arg branch "$BRANCH" \
              --arg commit "$COMMIT_SHA" \
              --arg url "$RUN_URL" \
              '{content: ("🔴 **CI NovaTech en échec**\nBranche : " + $branch + "\nCommit : " + $commit + "\nRun : " + $url)}')
            curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          else
            echo "::warning::DISCORD_WEBHOOK_URL non configuré, notification réelle non envoyée, voir le résumé ci-dessus"
          fi
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recherche de secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --no-banner
